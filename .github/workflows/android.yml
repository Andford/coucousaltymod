name: Android

# Builds Mochi for Android (android/) and uploads the APK.
# Run it by hand (Actions → Android → Run workflow) or push to android/.
#
# Signing: add the repo secrets MOCHI_KEYSTORE_B64 (the keystore, base64) and
# MOCHI_KEYSTORE_PASSWORD so every build has the same signature and installs
# over the last one. Without them a throwaway key is used (uninstall first).

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOCHI_KEYSTORE_PASSWORD: ${{ secrets.MOCHI_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.MOCHI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$MOCHI_KEYSTORE_PASSWORD" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/mochi.jks"
            echo "MOCHI_KEYSTORE=$RUNNER_TEMP/mochi.jks" >> "$GITHUB_ENV"
            echo "Signing with the stable key."
          else
            echo "::warning::No MOCHI_KEYSTORE_B64 / MOCHI_KEYSTORE_PASSWORD secrets: this APK uses a throwaway key and will not install over a previous one."
          fi

      # Failures also show as annotations (compile errors and failed tests).
      - name: Unit tests
        run: |
          set -o pipefail
          gradle -p android testDebugUnitTest --console=plain 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            grep -E '^e: |FAILED|What went wrong|error:|ERROR:' -A2 "$RUNNER_TEMP/test.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            for f in android/*/build/test-results/*/*.xml; do
              grep -h -B1 -A3 '<failure' "$f" 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            done
            exit 1
          }

      # Release: R8-optimised (smooth on the watch), signed with the stable key.
      - name: Build the APKs
        run: |
          set -o pipefail
          gradle -p android assembleRelease --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E '^e: |ERROR:|What went wrong|Missing class' -A3 "$RUNNER_TEMP/build.log" | head -50 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Name the APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Mochi-${GITHUB_SHA::7}.apk"
          cp android/wear/build/outputs/apk/release/wear-release.apk "out/Mochi-Watch-${GITHUB_SHA::7}.apk"
          cp android/watchface/build/outputs/apk/release/watchface-release.apk "out/Mochi-Caratula-${GITHUB_SHA::7}.apk"
          cp android/notas/build/outputs/apk/release/notas-release.apk "out/TokkipNotas-${GITHUB_SHA::7}.apk"

      # The SHA-1 Google Cloud's Android OAuth client needs (Google Tasks), as an annotation.
      - name: Signing fingerprint
        run: |
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          apk=$(ls out/Mochi-*.apk | grep -v Watch | grep -v Caratula | head -1)
          sha=$("$signer" verify --print-certs "$apk" 2>&1 | grep -m1 'SHA-1 digest' | awk '{print $NF}' | sed 's/../&:/g;s/:$//' | tr a-f A-F)
          echo "::notice::Paquete mx.loperstack.mochi · SHA-1 $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-Android
          path: out/*.apk
          retention-days: 7
