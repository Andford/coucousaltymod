[package]
name = "tokkip-notas"
description = "Tokkip Notas para Windows: tus páginas, tableros y tablas, con el diseño de Tokkip"
authors = ["Andy (LoperStack)"]
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "tokkip_notas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The pages live in SQLite, like on Android (the same table). Bundled, so
# nothing has to be installed on the PC.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
